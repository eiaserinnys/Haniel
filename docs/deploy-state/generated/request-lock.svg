"3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="121.78" y="303.9">자동 탐침의 답에 실패 저널이</tspan><tspan x="121.78" y="321.9">실려 왔다</tspan></text></g><g class="pele-edge-label" data-id="edge2"><rect x="237.57" y="297.5" width="141.78" height="21" rx="3" fill="var(--_bg)"/><text x="308.46" y="312.9" text-anchor="middle">시도가 실패로 끝난다</text></g><g class="pele-edge-label" data-id="edge3"><rect x="399.35" y="281" width="205.57" height="54" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="502.14" y="294.9">허가가 노드에 닿지 못해 시도를</tspan><tspan x="502.14" y="312.9">닫는다 [닿았는지 모름 그리고</tspan><tspan x="502.14" y="330.9">판 없는 시도] (PR 2에서 바뀜)</tspan></text></g><g class="pele-edge-label" data-id="edge4"><rect x="624.92" y="290" width="173.68" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="711.76" y="303.9">실행 임대의 마감이 지난다</tspan><tspan x="711.76" y="321.9">[시작했다]</tspan></text></g><g class="pele-edge-label" data-id="edge5"><rect x="818.6" y="290" width="205.57" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="921.38" y="303.9">끊긴 동안의 유예 마감이 지난다</tspan><tspan x="921.38" y="321.9">[줄 서 있음]</tspan></text></g><g class="pele-edge-label" data-id="edge6"><rect x="1044.16" y="290" width="191.57" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1139.95" y="303.9">다시 붙은 노드의 목록에 지금</tspan><tspan x="1139.95" y="321.9">시도가 없다 [시작했다]</tspan></text></g><g class="pele-edge-label" data-id="edge7"><rect x="1255.73" y="290" width="173.68" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1342.57" y="303.9">노드가 자기 배포의 실패를</tspan><tspan x="1342.57" y="321.9">알린다 [요청이 열려 있음]</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="1449.41" y="297.5" width="205.57" height="21" rx="3" fill="var(--_bg)"/><text x="1552.19" y="312.9" text-anchor="middle">닫힌