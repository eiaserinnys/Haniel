# Invalid: circular dependency in after fields
# A -> B -> C -> A creates a cycle
poll_interval: 60

repos: {}

services:
  service-a:
    run: python -m service_a
    ready: delay:0.01
    after: service-c

  service-b:
    run: python -m service_b
    ready: delay:0.01
    after: service-a

  service-c:
    run: python -m service_c
    ready: delay:0.01
    after: service-b
